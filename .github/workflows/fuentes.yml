name: Vigilar las fuentes de TikTok

# El primer domingo de cada mes abre cada fuente oficial de skills/tiktok-studio/data/fuentes.json
# y comprueba que siga diciendo la frase en la que se apoya cada regla. Si una frase desapareció,
# el trabajo falla y GitHub avisa: toca releer la página y actualizar la skill (SKILL.md,
# «Mantener al día»). Si TikTok bloquea la lectura desde GitHub, también falla (salida 2) para
# que se repita desde otra conexión. No modifica nada por sí solo.
on:
  schedule:
    - cron: "41 16 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ¿Primer domingo del mes?
        id: dia
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%d)" -le 7 ]; then
            echo "toca=si" >> "$GITHUB_OUTPUT"
          else
            echo "toca=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.dia.outputs.toca == 'si'
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.dia.outputs.toca == 'si'
        with:
          python-version: "3.12"
      - name: Revisar fuentes oficiales (solo lectura; el contenido de las páginas no se ejecuta)
        if: steps.dia.outputs.toca == 'si'
        run: python3 skills/tiktok-studio/scripts/tiktokstudio.py fuentes revisar
