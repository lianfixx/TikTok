name: Vigilar las fuentes de TikTok

# El primer domingo de cada mes abre cada fuente oficial de skills/tiktok-studio/data/fuentes.json
# y comprueba, solo dentro del artículo, que siga diciendo la frase en la que se apoya cada regla.
# - Si todo sigue igual: sella la fecha en fuentes.json y la registra en CHANGELOG.md con un commit
#   propio (autorizado por Emi el 17/11/2026).
# - Si una frase desapareció o una página cambió de dirección (salida 1), no se pudo leer ninguna (2)
#   o alguna (3): el trabajo falla y GitHub avisa. Toca releer y actualizar la skill (SKILL.md,
#   «Mantener al día»). Nunca cambia una regla por sí solo.
on:
  schedule:
    - cron: "41 16 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ¿Primer domingo del mes?
        id: dia
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%d)" -le 7 ]; then
            echo "toca=si" >> "$GITHUB_OUTPUT"
          else
            echo "toca=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.dia.outputs.toca == 'si'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.dia.outputs.toca == 'si'
        with:
          python-version: "3.12"
      - name: Revisar fuentes oficiales (solo lectura; el contenido de las páginas no se ejecuta)
        if: steps.dia.outputs.toca == 'si'
        run: python3 skills/tiktok-studio/scripts/tiktokstudio.py fuentes revisar --sellar
      - name: Registrar el sello
        if: steps.dia.outputs.toca == 'si'
        run: |
          if git diff --quiet -- skills/tiktok-studio/data/fuentes.json; then
            echo "Sin cambios que registrar."; exit 0
          fi
          hoy=$(TZ=America/Mexico_City date +%F)
          python3 - "$hoy" <<'PY'
          import pathlib, sys
          hoy = sys.argv[1]
          p = pathlib.Path("CHANGELOG.md"); t = p.read_text(encoding="utf-8")
          entrada = (f"## {hoy} · Fuentes de TikTok verificadas\n"
                     "- Agente: GitHub Actions (workflow fuentes.yml)\n"
                     "- Solicitud: revisión mensual automática autorizada por Emi el 17/11/2026.\n"
                     "- Cambios: todas las frases vigiladas siguen en su artículo oficial; se sella la fecha.\n"
                     "- Archivos: `skills/tiktok-studio/data/fuentes.json` y este registro.\n"
                     "- Verificación: `tiktokstudio.py fuentes revisar --sellar` → aprobado.\n"
                     "- Pendiente: ninguno.\n\n")
          i = t.index("\n## ")
          p.write_text(t[:i + 1] + entrada + t[i + 1:], encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/tiktok-studio/data/fuentes.json CHANGELOG.md
          git commit -m "Fuentes de TikTok verificadas ($hoy)" -m "IA-Actor: GitHub Actions"
          python3 ia/verificar.py ci
          git push
