name: Vigilar las fuentes de TikTok

# El primer domingo de cada mes abre cada fuente oficial de skills/tiktok-studio/data/fuentes.json
# y comprueba, solo dentro del artículo, que siga diciendo la frase en la que se apoya cada regla.
# Falla y GitHub avisa si una frase desapareció o la página cambió de dirección (salida 1), si no se
# pudo leer ninguna página (2) o alguna (3). Toca releer y actualizar la skill (SKILL.md, «Mantener
# al día»). Solo lee: no sella fechas ni escribe en el repositorio (eso lo hace una sesión con Emi).
on:
  schedule:
    - cron: "41 16 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ¿Primer domingo del mes?
        id: dia
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%d)" -le 7 ]; then
            echo "toca=si" >> "$GITHUB_OUTPUT"
          else
            echo "toca=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.dia.outputs.toca == 'si'
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.dia.outputs.toca == 'si'
        with:
          python-version: "3.12"
      - name: Revisar fuentes oficiales (solo lectura; el contenido de las páginas no se ejecuta)
        if: steps.dia.outputs.toca == 'si'
        run: python3 skills/tiktok-studio/scripts/tiktokstudio.py fuentes revisar
